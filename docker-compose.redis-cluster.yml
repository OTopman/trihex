services:
  redis-node-1:
    image: redis:7-alpine
    container_name: trihex-redis-1
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly no --protected-mode no
    ports:
      - "7379:6379"

  redis-node-2:
    image: redis:7-alpine
    container_name: trihex-redis-2
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly no --protected-mode no
    ports:
      - "7380:6379"

  redis-node-3:
    image: redis:7-alpine
    container_name: trihex-redis-3
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly no --protected-mode no
    ports:
      - "7381:6379"

  cluster-init:
    image: redis:7-alpine
    container_name: trihex-redis-init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    command: >
      sh -c "sleep 2 && redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 --cluster-yes && echo 'CLUSTER_CREATED_SUCCESS'"
