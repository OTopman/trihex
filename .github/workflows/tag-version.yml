name: Auto Tag Version

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Create Git Tag from package.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate SemVer & Check Existing Tags
        id: check_tag
        run: |
          # Extract version from package.json
          RAW_VERSION=$(node -p "require('./package.json').version")
          
          # Normalize by stripping any leading 'v' or 'V' to avoid malformed 'vv1.0.0'
          CLEAN_VERSION="${RAW_VERSION#[vV]}"
          
          # Strictly validate SemVer (e.g. 1.0.0, 1.2.3-rc.1)
          SEMVER_REGEX="^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$"
          if ! [[ "$CLEAN_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid SemVer string '$RAW_VERSION' in package.json. Expected format: X.Y.Z (e.g., 1.0.0 or 1.0.0-rc.1)"
            exit 1
          fi

          # Format tag to strictly match release.yml expectation ('v*')
          TAG="v${CLEAN_VERSION}"
          
          echo "Extracted package version: $CLEAN_VERSION"
          echo "Formatted release tag:     $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

          # Fetch remote tags to check existence
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' already exists on remote. Skipping creation."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$TAG' does not exist. Ready to create."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and Push Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          VERSION="${{ steps.check_tag.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Creating annotated tag: $TAG"
          git tag -a "$TAG" -m "Release $TAG (version $VERSION)"

          echo "Pushing tag $TAG to origin..."
          git push origin "$TAG"

      - name: Trigger Downstream Production Release
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          
          # If RELEASE_PAT is provided, the git push event automatically triggers release.yml.
          # If using default GITHUB_TOKEN, dispatch release.yml explicitly to bypass GitHub Actions loop guard.
          if [ -n "${{ secrets.RELEASE_PAT }}" ]; then
            echo "RELEASE_PAT detected: release.yml will be triggered via git push tag event."
          else
            echo "Default GITHUB_TOKEN used: dispatching release.yml for tag '$TAG'..."
            gh workflow run release.yml --ref "$TAG" || echo "Note: If workflow dispatch fails, ensure Workflow permissions are set to Read & Write."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Job Summary
        run: |
          if [ "${{ steps.check_tag.outputs.exists }}" = "false" ]; then
            echo "### 🏷️ Tag Created: \`${{ steps.check_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag Name:** \`${{ steps.check_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Package Version:** \`${{ steps.check_tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Match:** Successfully matches \`v*\` filter in \`.github/workflows/release.yml\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ Skipped: Tag \`${{ steps.check_tag.outputs.tag }}\` Already Exists" >> $GITHUB_STEP_SUMMARY
            echo "Tag \`${{ steps.check_tag.outputs.tag }}\` already exists on the remote repository. No new tag was created." >> $GITHUB_STEP_SUMMARY
          fi
